name: Daily Forecast Update

on:
  schedule:
    # Runs at 6:00 PM IST (12:30 UTC) every weekday Monday-Friday
    - cron: '30 12 * * 1-5'
  workflow_dispatch:  # allows manual trigger from GitHub Actions tab

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run forecast pipeline
        run: uv run main.py

      - name: Commit updated outputs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/
          git diff --staged --quiet || git commit -m "auto: daily forecast update $(date -u '+%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}